version: '3.8'

services:
  curator:
    image: bl4ut0/curator:latest
    # To build locally instead of pulling from Docker Hub, uncomment the build section below:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: curator-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - CLIENT_ID=${CLIENT_ID}
      - GUILD_ID=${GUILD_ID}
      - DATABASE_PATH=/app/data/curator.db
    volumes:
      - curator-data:/app/data

  # Optional: Automatic Container Updater (Watchtower)
  # Automatically pulls new Docker Hub images and restarts Curator without downtime
  watchtower:
    image: containrrr/watchtower
    container_name: curator-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 300 curator-bot

volumes:
  curator-data:
    driver: local

